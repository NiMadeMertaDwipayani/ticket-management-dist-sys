<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Berpikir Kritis - Challenge Mode</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1 id="gameTitle">🎯 Game Berpikir Kritis</h1>
      <p class="subtitle" id="gameSubtitle">Memuat game...</p>
    </div>
  </header>

  <div class="container">
    <!-- Game Content Area -->
    <div id="gameContent"></div>

    <!-- Results Modal -->
    <div id="resultsModal" class="modal" style="display: none;">
      <div class="modal-content" style="max-width: 600px;">
        <span class="close-modal" onclick="closeResults()">&times;</span>
        <div id="resultsContent"></div>
      </div>
    </div>
  </div>

  <script src="js/game-critical.js"></script>
</body>
</html>
